<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login • FitCampus AI</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div style="text-align:center; margin-bottom: 18px;">
            <div class="brand-logo" style="margin:0 auto 10px; width:54px; height:54px; font-size:24px;">FC</div>
            <div class="auth-title">Welcome Back</div>
            <div class="auth-sub">Sign in to continue your fitness journey</div>
        </div>
        <form id="loginForm">
            <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="email" required placeholder="you@campus.edu" /></div>
            <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="password" required placeholder="••••••••" /></div>
            <button class="btn btn-primary btn-block" type="submit">Sign In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
            <div style="margin-top:10px; font-size:12px; color:var(--gray-500);">Demo: <b>demo@fitcampus.com</b> / <b>demo1234</b></div>
        </div>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.redirectIfLogged("index.html");
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    btn.disabled = true; btn.innerHTML = '<span class="loader"></span>';
    try {
        const res = await API.post("/api/auth/login", {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
        });
        API.setToken(res.access_token); API.setUser(res.user);
        toast("Welcome back!", "success");
        setTimeout(() => window.location.href = "index.html", 400);
    } catch (err) { toast(err.message, "error"); btn.disabled = false; btn.textContent = "Sign In"; }
});
</script>
</body>
</html>
